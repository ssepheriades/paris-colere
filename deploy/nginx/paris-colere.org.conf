# /etc/nginx/sites-available/paris-colere.org
# ln -s ... sites-enabled/  puis certbot --nginx -d paris-colere.org -d www.paris-colere.org

upstream paris_colere_api {
    server 127.0.0.1:9080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name paris-colere.org www.paris-colere.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://paris-colere.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.paris-colere.org;

    ssl_certificate     /etc/letsencrypt/live/paris-colere.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paris-colere.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://paris-colere.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paris-colere.org;

    ssl_certificate     /etc/letsencrypt/live/paris-colere.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paris-colere.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/paris-colere.org;
    index index.html;

    client_max_body_size 20M;

    location /api {
        proxy_pass http://paris_colere_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /admin {
        proxy_pass http://paris_colere_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /login {
        proxy_pass http://paris_colere_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://paris_colere_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bundles/ {
        proxy_pass http://paris_colere_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
