# Smoke test local (pas pour Coolify) :
#   docker compose -f deploy/coolify/compose.smoke.yaml up --build --wait
# Coolify utilise le Dockerfile racine + Postgres en ressource séparée.
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "9080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: smoke-test-secret-change-me-32b
      DEFAULT_URI: http://127.0.0.1:9080
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
      SERVER_NAME: ":80"
      CADDY_GLOBAL_OPTIONS: auto_https off
      SYMFONY_TRUSTED_PROXIES: REMOTE_ADDR
      SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-proto,x-forwarded-port,x-forwarded-host
      # Via port publié hôte (fiable hors Coolify). Coolify : host interne Postgres.
      DATABASE_URL: postgresql://app:smoke@host.docker.internal:54329/paris_colere?serverVersion=18&charset=utf8
      ADMIN_EMAIL: admin@paris-colere.test
      ADMIN_PASSWORD: admin
      API_TOKEN: ""
    volumes:
      - paris_colere_uploads:/app/public/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(false === @file_get_contents('http://127.0.0.1:80/api', context: stream_context_create(['http' => ['timeout' => 5, 'ignore_errors' => true]])) ? 1 : 0);",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: paris_colere
      POSTGRES_USER: app
      POSTGRES_PASSWORD: smoke
    # Publié pour le smoke local (certains environnements bloquent le bridge Docker).
    # Sur Coolify, l’app joint Postgres via le réseau interne (pas ce mapping).
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d paris_colere"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      # Postgres 18+ : monter /var/lib/postgresql (pas .../data)
      - paris_colere_pg_smoke:/var/lib/postgresql

volumes:
  paris_colere_uploads:
  paris_colere_pg_smoke:
