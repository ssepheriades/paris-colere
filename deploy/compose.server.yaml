---
# VPS : API en local uniquement, TLS et site statique via nginx sur l'hôte.
services:
  php:
    environment:
      SERVER_NAME: ${SERVER_NAME}
      DEFAULT_URI: https://${SERVER_NAME}
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-127.0.0.0/8,REMOTE_ADDR}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https://paris-colere\.org$}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Pas de certificat dans le conteneur : nginx termine le TLS
      CADDY_GLOBAL_OPTIONS: auto_https off
    ports: !reset
      - ${HTTP_PORT:-127.0.0.1:9080}:80
    volumes:
      - paris_colere_uploads:/app/public/uploads

volumes:
  paris_colere_uploads:
